services:
  # ── Fidel CNN Model Tester ─────────────────────────────────────────────────
  - type: web
    name: fidel-cnn
    runtime: python
    rootDir: render/fidel-cnn
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 server:app
    envVars:
      - key: FIDEL_MODEL_PATH
        value: models/fidel_cnn_inference1.pt
      - key: FIDEL_CHARS_PATH
        value: models/chars.json
    plan: free

  # ── Sign Language Translator ───────────────────────────────────────────────
  - type: web
    name: sign-language
    runtime: python
    rootDir: render/sign-language
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
